<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Product Features</title>
  <style>
    .features {
      display: flex;
      flex-wrap: wrap;
      gap: 1.5rem;
      font-family: Arial, sans-serif;
    }

    .feature {
      flex: 1 1 200px;
      padding: 1.5rem;
      border-top: 2px solid #387f6d;
    }

    .feature svg {
      width: 40px;
      height: 40px;
      fill: none;
      stroke: #387f6d;
      stroke-width: 2;
    }

    .feature p {
      color: #666666;
    }
  </style>
</head>
<body>
  <h1>Product Features</h1>

  <section class="features">
    <article class="feature">
      <svg viewBox="0 0 40 40" aria-hidden="true">
        <circle cx="20" cy="20" r="14"></circle>
        <path d="m12 20 5 5 11-12"></path>
      </svg>
      <h2>Reliable</h2>
      <p>Designed to work every day.</p>
    </article>

    <article class="feature">
      <svg viewBox="0 0 40 40" aria-hidden="true">
        <path d="M7 10h26v20H7zM7 16h26"></path>
      </svg>
      <h2>Simple</h2>
      <p>Clear tools with less friction.</p>
    </article>

    <article class="feature">
      <svg viewBox="0 0 40 40" aria-hidden="true">
        <path d="M20 5v30M5 20h30M9 9l22 22M31 9 9 31"></path>
      </svg>
      <h2>Flexible</h2>
      <p>Fits the way you work.</p>
    </article>
  </section>
</body>
</html>
