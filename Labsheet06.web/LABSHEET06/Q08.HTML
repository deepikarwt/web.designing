<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pricing Plans</title>
  <style>
    .plans {
      display: flex;
      flex-wrap: wrap;
      gap: 1rem;
      font-family: Arial, sans-serif;
    }

    .plan {
      position: relative;
      flex: 1 1 190px;
      padding: 2rem;
      border: 1px solid #aaaaaa;
      border-radius: 12px;
      transition: transform 0.2s, box-shadow 0.2s;
    }

    .plan:hover {
      transform: translateY(-6px);
      box-shadow: 0 12px 28px #0002;
    }

    .popular {
      border: 3px solid #267967;
    }

    .popular-label {
      color: #267967;
      font-size: 0.7rem;
      font-weight: bold;
    }

    .price {
      font-size: 1.5rem;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <h1>Pricing Plans</h1>

  <section class="plans">
    <article class="plan">
      <h2>Basic</h2>
      <p class="price">$9 / month</p>
      <p>For getting started.</p>
    </article>

    <article class="plan popular">
      <p class="popular-label">MOST POPULAR</p>
      <h2>Pro</h2>
      <p class="price">$19 / month</p>
      <p>For growing teams.</p>
    </article>

    <article class="plan">
      <h2>Team</h2>
      <p class="price">$39 / month</p>
      <p>For larger projects.</p>
    </article>
  </section>
</body>
</html>
