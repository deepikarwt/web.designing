<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Theme Toggle</title>
  <style>
    :root {
      --background: #ffffff;
      --text: #222222;
      --accent: #126b5a;
    }

    :root.dark {
      --background: #171a19;
      --text: #f5f5f5;
      --accent: #8dd8c4;
    }

    body {
      padding: 2rem;
      background: var(--background);
      color: var(--text);
      font-family: Arial, sans-serif;
    }

    button {
      padding: 0.7rem;
      border: none;
      background: var(--accent);
      color: white;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <h1>Theme Demo</h1>
  <p>Click the button to change the page theme.</p>
  <button id="themeButton">Switch to dark mode</button>

  <script>
    const button = document.querySelector("#themeButton");

    button.addEventListener("click", () => {
      const darkMode = document.documentElement.classList.toggle("dark");
      button.textContent = darkMode
        ? "Switch to light mode"
        : "Switch to dark mode";
    });
  </script>
</body>
</html>
