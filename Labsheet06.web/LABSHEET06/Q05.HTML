<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Photo Gallery</title>
  <style>
    .gallery {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 1rem;
    }

    .gallery img {
      width: 100%;
      height: 220px;
      object-fit: cover;
      transition: transform 0.35s;
    }

    .gallery img:hover {
      transform: scale(1.05);
    }
  </style>
</head>
<body>
  <h1>Photo Gallery</h1>

  <div class="gallery">
    <img src="https://picsum.photos/id/1015/600/400" alt="Mountain lake">
    <img src="https://picsum.photos/id/1011/600/400" alt="Forest">
    <img src="https://picsum.photos/id/1018/600/400" alt="Mountains">
  </div>
</body>
</html>
