<?php
session_start();
require 'db.php';

if (empty($_SESSION['user_id'])) {
    header('Location: login.php');
    exit;
}
$userId = (int)$_SESSION['user_id'];

$stmt = $db->prepare(
    'SELECT id, total, status, created_at FROM orders WHERE user_id = ? ORDER BY created_at DESC'
);
$stmt->bind_param('i', $userId);
$stmt->execute();
$orders = $stmt->get_result();
?>
<h1>My orders</h1>
<?php while ($order = $orders->fetch_assoc()): ?>
  <p>Order #<?= (int)$order['id'] ?> · $<?= number_format((float)$order['total'], 2) ?> ·
     <?= htmlspecialchars($order['status']) ?> · <?= htmlspecialchars($order['created_at']) ?></p>
<?php endwhile; ?>
